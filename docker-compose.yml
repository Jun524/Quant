services:
  freqtrade:
    image: freqtradeorg/freqtrade:2026.8
    container_name: binance-quant
    restart: unless-stopped
    volumes:
      - ./user_data:/freqtrade/user_data
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      FREQTRADE__EXCHANGE__API_KEY: "${BINANCE_API_KEY:-}"
      FREQTRADE__EXCHANGE__SECRET: "${BINANCE_API_SECRET:-}"
      FREQTRADE__API_SERVER__USERNAME: "${FREQTRADE_API_USERNAME:-freqtrader}"
      FREQTRADE__API_SERVER__PASSWORD: "${FREQTRADE_API_PASSWORD:-change-me-before-live}"
      FREQTRADE__API_SERVER__JWT_SECRET_KEY: "${FREQTRADE_JWT_SECRET:-change-me-before-live-too}"
    command:
      - trade
      - --logfile
      - /freqtrade/user_data/logs/freqtrade.log
      - --db-url
      - sqlite:////freqtrade/user_data/tradesv3.dryrun.sqlite
      - --config
      - /freqtrade/user_data/config.json
      - --strategy
      - TrendBreakoutStrategy

  freqtrade-futures:
    image: freqtradeorg/freqtrade:2026.8
    container_name: binance-quant-futures
    profiles: ["futures"]
    restart: unless-stopped
    volumes:
      - ./user_data:/freqtrade/user_data
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      FREQTRADE__EXCHANGE__API_KEY: "${BINANCE_FUTURES_API_KEY:-}"
      FREQTRADE__EXCHANGE__SECRET: "${BINANCE_FUTURES_API_SECRET:-}"
      FREQTRADE__API_SERVER__USERNAME: "${FREQTRADE_API_USERNAME:-freqtrader}"
      FREQTRADE__API_SERVER__PASSWORD: "${FREQTRADE_API_PASSWORD:-change-me-before-live}"
      FREQTRADE__API_SERVER__JWT_SECRET_KEY: "${FREQTRADE_JWT_SECRET:-change-me-before-live-too}"
    command:
      - trade
      - --logfile
      - /freqtrade/user_data/logs/freqtrade-futures.log
      - --db-url
      - sqlite:////freqtrade/user_data/tradesv3.futures-dryrun.sqlite
      - --config
      - /freqtrade/user_data/config.futures.json
      - --strategy
      - FuturesBtcRegimeRiskBudgetLong
